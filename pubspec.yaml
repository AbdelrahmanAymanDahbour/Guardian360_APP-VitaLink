name: guardian360
description: "Guardian 360 - Smart Rescue Application (VitaLink System)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  easy_localization: ^3.0.8

  provider: ^6.1.2

  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  characters: 1.4.0

  url_launcher: ^6.3.2

  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.0.1
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8
  google_sign_in: ^6.2.1

  geolocator: ^14.0.2
  google_maps_flutter: ^2.17.0
  geocoding: ^3.0.0
  http: ^1.2.0

  sensors_plus: ^6.1.1
  flutter_background_service: ^5.1.0
  battery_plus: ^6.0.0
  local_auth: ^2.2.0
  permission_handler: ^11.3.1
  connectivity_plus: ^7.1.0
  lottie: ^3.3.2
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.2
  speech_to_text: ^7.3.0

  flutter_contacts: ^2.0.2

  # Evidence files for Smart Kroka reports.
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # OCR for Smart Kroka vehicle plate recognition.
  google_mlkit_text_recognition: ^0.15.1

  # Smart Kroka PDF report generation.
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.8

  # OTP input with SMS autofill support
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/langs/
    - assets/map_styles/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8F9FA"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/app_icon.png"
  color_dark: "#121212"
  image_dark: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#121212"